name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 (10.0.202)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.202'

      - name: Select Xcode 26.3 and fix SDK layout
        run: |
          echo "===== 可用 Xcode（含符号链接解析）====="
          ls -la /Applications/ | grep -i xcode || true
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep "26.3" | head -1)
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          XCREAL=$(readlink -f "$XC")
          echo "选择 Xcode: $XC => 真实路径 $XCREAL"
          export DEVELOPER_DIR="$XCREAL/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCREAL/Contents/Developer"
          xcodebuild -version
          echo "===== MacOSX SDK 目录布局 ====="
          SDKS="$XCREAL/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
          ls -la "$SDKS" || true
          if [ ! -e "$SDKS/MacOSX.sdk" ]; then
            VERSDK=$(ls -d "$SDKS"/MacOSX*.sdk 2>/dev/null | grep -v "MacOSX.sdk" | head -1)
            if [ -n "$VERSDK" ]; then
              sudo ln -s "$VERSDK" "$SDKS/MacOSX.sdk"
              echo "已创建 MacOSX.sdk 符号链接指向 $VERSDK"
            fi
          fi
          echo "===== actool 查找诊断 ====="
          xcrun -find actool || true
          xcodebuild -sdk "$SDKS/MacOSX.sdk" -find actool || true

      - name: Install workloads (set 10.0.202 => iOS 26.2.10233, Xcode 26.3)
        run: |
          set +e
          dotnet workload install maui-android ios maccatalyst --version 10.0.202 > workload.log 2>&1
          EXIT=$?
          cat workload.log
          echo "===== 已安装 workload ====="
          dotnet workload list
          if [ $EXIT -ne 0 ]; then
            ERR=$(tail -15 workload.log | tr '\n' '|' | head -c 30000)
            echo "::error::workload安装失败: $ERR"
            exit 1
          fi

      - name: Build and package unsigned IPA
        run: |
          set +e
          dotnet publish Gomoku.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:MtouchSignAssembly=false \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=false \
            -v minimal > publish.log 2>&1
          EXIT=$?
          echo "===== PUBLISH 退出码: $EXIT ====="
          cat publish.log
          echo "===== publish 目录内容 ====="
          find bin/Release/net10.0-ios/ios-arm64/ -maxdepth 3 2>/dev/null | head -50 || true

          if [ $EXIT -ne 0 ]; then
            echo "===== publish.log 最后30行 ====="
            tail -30 publish.log
            ERR=$(tail -10 publish.log | tr '\n' '|' | head -c 60000)
            echo "::error::publish失败: $ERR"
            exit 1
          fi

          APPDIR=$(find bin/Release/net10.0-ios -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APPDIR" ]; then
            APPDIR=$(find . -name "*.app" -type d 2>/dev/null | grep -v obj | head -1)
          fi
          echo "找到 .app: $APPDIR"
          if [ -z "$APPDIR" ]; then
            LIST1=$(find bin -maxdepth 5 -type d 2>/dev/null | head -30 | tr '\n' '|')
            LIST2=$(find . -name "*.app" 2>/dev/null | head -5 | tr '\n' '|')
            echo "::error::未找到 .app 包。bin目录结构: $LIST1 ||| app搜索: $LIST2"
            exit 1
          fi

          rm -rf Payload Gomoku.ipa
          mkdir -p Payload
          cp -R "$APPDIR" Payload/
          zip -qr Gomoku.ipa Payload
          ls -la Gomoku.ipa
          echo "===== IPA 已生成 ====="

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-unsigned-ipa
          path: Gomoku.ipa

      - name: Create GitHub Release with IPA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Gomoku.ipa \
            --title "五子棋 iOS $TAG" \
            --notes "未签名 IPA，用 Sideloadly 侧载安装。Release 资产可免登录下载。" \
            --target "$GITHUB_SHA"
          echo "===== Release 已创建 ====="
