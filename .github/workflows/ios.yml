name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select latest Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install workloads
        run: dotnet workload restore Gomoku.csproj

      - name: Build and package unsigned IPA
        run: |
          set +e
          dotnet publish Gomoku.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:MtouchSignAssembly=false \
            -p:CodesignKey= \
            -p:CodesignProvision= \
            -p:BuildIpa=false \
            -v minimal > publish.log 2>&1
          EXIT=$?
          echo "===== PUBLISH 退出码: $EXIT ====="
          cat publish.log
          echo "===== publish 目录内容 ====="
          find bin/Release/net10.0-ios/ios-arm64/ -maxdepth 3 2>/dev/null | head -50 || true

          if [ $EXIT -ne 0 ]; then
            echo "===== publish.log 最后30行 ====="
            tail -30 publish.log
            ERR=$(tail -10 publish.log | tr '\n' '|' | head -c 60000)
            echo "::error::publish失败: $ERR"
            exit 1
          fi

          APPDIR=$(find bin/Release/net10.0-ios/ios-arm64/publish -name "*.app" -type d | head -1)
          echo "找到 .app: $APPDIR"
          if [ -z "$APPDIR" ]; then
            echo "::error::未找到 .app 包"
            find . -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          rm -rf Payload Gomoku.ipa
          mkdir -p Payload
          cp -R "$APPDIR" Payload/
          zip -qr Gomoku.ipa Payload
          ls -la Gomoku.ipa
          echo "===== IPA 已生成 ====="

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-unsigned-ipa
          path: Gomoku.ipa
