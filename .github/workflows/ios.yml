name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select latest Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install workloads
        run: dotnet workload restore Gomoku.csproj

      - name: Build and package unsigned IPA
        run: |
          set -e
          dotnet publish Gomoku.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:MtouchSignAssembly=false \
            -p:CodesignKey= \
            -p:CodesignProvision= \
            -p:BuildIpa=false \
            -v minimal

          echo "===== Publish 输出目录 ====="
          find bin/Release/net10.0-ios/ios-arm64/publish -maxdepth 2 -type d 2>/dev/null || true
          ls -la bin/Release/net10.0-ios/ios-arm64/publish/ 2>/dev/null || true

          APPDIR=$(find bin/Release/net10.0-ios/ios-arm64/publish -name "*.app" -type d | head -1)
          echo "找到 .app: $APPDIR"

          if [ -z "$APPDIR" ]; then
            echo "::error::未找到 .app 包"
            find . -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          # 手动打包 IPA（Payload/*.app）
          rm -rf Payload Gomoku.ipa
          mkdir -p Payload
          cp -R "$APPDIR" Payload/
          zip -qr Gomoku.ipa Payload
          ls -la Gomoku.ipa
          echo "===== IPA 已生成 ====="

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-unsigned-ipa
          path: Gomoku.ipa
