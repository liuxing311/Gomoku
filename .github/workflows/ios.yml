name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select latest Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install iOS workload
        run: dotnet workload install ios --source https://api.nuget.org/v3/index.json

      - name: Publish unsigned IPA
        continue-on-error: true
        run: |
          set +e
          dotnet publish Gomoku.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:MtouchSignAssembly=false \
            -p:CodesignKey= \
            -p:CodesignProvision= \
            -p:BuildIpa=true \
            -v minimal > publish.log 2>&1
          echo "PUBLISH_EXIT=$?"
          echo "===== PUBLISH LOG ====="
          cat publish.log
          echo "===== PUBLISH DIR ====="
          find . -name "*.ipa" 2>/dev/null || true
          ls -la bin/Release/net10.0-ios/ios-arm64/publish/ 2>/dev/null || true

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: publish.log

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-unsigned-ipa
          path: '**/publish/*.ipa'
