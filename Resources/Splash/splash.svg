<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#EBC07E"/>
      <stop offset="0.55" stop-color="#D29A52"/>
      <stop offset="1" stop-color="#B87C3B"/>
    </linearGradient>
    <radialGradient id="blackStone" cx="0.35" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#5C5C5C"/>
      <stop offset="0.55" stop-color="#241C15"/>
      <stop offset="1" stop-color="#120D08"/>
    </radialGradient>
    <radialGradient id="whiteStone" cx="0.35" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F4EEE2"/>
      <stop offset="1" stop-color="#D9CDB8"/>
    </radialGradient>
  </defs>

  <!-- 透明背景（由 csproj 的 Color 属性填充米色），居中棋盘 -->
  <ellipse cx="228" cy="400" rx="150" ry="14" fill="#000000" opacity="0.12"/>
  <rect x="58" y="58" width="340" height="340" rx="46" fill="url(#wood)" stroke="#8A5A28" stroke-width="3"/>

  <!-- 棋盘网格 9x9 -->
  <g stroke="#6B4A2F" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <line x1="92" y1="92" x2="92" y2="364"/>
    <line x1="126" y1="92" x2="126" y2="364"/>
    <line x1="160" y1="92" x2="160" y2="364"/>
    <line x1="194" y1="92" x2="194" y2="364"/>
    <line x1="228" y1="92" x2="228" y2="364"/>
    <line x1="262" y1="92" x2="262" y2="364"/>
    <line x1="296" y1="92" x2="296" y2="364"/>
    <line x1="330" y1="92" x2="330" y2="364"/>
    <line x1="364" y1="92" x2="364" y2="364"/>
    <line x1="92" y1="92" x2="364" y2="92"/>
    <line x1="92" y1="126" x2="364" y2="126"/>
    <line x1="92" y1="160" x2="364" y2="160"/>
    <line x1="92" y1="194" x2="364" y2="194"/>
    <line x1="92" y1="228" x2="364" y2="228"/>
    <line x1="92" y1="262" x2="364" y2="262"/>
    <line x1="92" y1="296" x2="364" y2="296"/>
    <line x1="92" y1="330" x2="364" y2="330"/>
    <line x1="92" y1="364" x2="364" y2="364"/>
  </g>
  <!-- 星位 -->
  <g fill="#6B4A2F">
    <circle cx="126" cy="126" r="3.2"/>
    <circle cx="330" cy="126" r="3.2"/>
    <circle cx="228" cy="228" r="3.2"/>
    <circle cx="126" cy="330" r="3.2"/>
    <circle cx="330" cy="330" r="3.2"/>
  </g>

  <!-- 白棋 -->
  <g>
    <circle cx="230" cy="163.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="228" cy="160" r="14.5" fill="url(#whiteStone)" stroke="#B8A88F" stroke-width="1.2"/>
    <circle cx="162" cy="231.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="160" cy="228" r="14.5" fill="url(#whiteStone)" stroke="#B8A88F" stroke-width="1.2"/>
    <circle cx="196" cy="299.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="194" cy="296" r="14.5" fill="url(#whiteStone)" stroke="#B8A88F" stroke-width="1.2"/>
  </g>

  <!-- 黑棋五连 -->
  <g>
    <circle cx="162" cy="163.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="160" cy="160" r="14.5" fill="url(#blackStone)"/>
    <circle cx="196" cy="197.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="194" cy="194" r="14.5" fill="url(#blackStone)"/>
    <circle cx="230" cy="231.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="228" cy="228" r="14.5" fill="url(#blackStone)"/>
    <circle cx="264" cy="265.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="262" cy="262" r="14.5" fill="url(#blackStone)"/>
    <circle cx="298" cy="299.5" r="14.5" fill="#000000" opacity="0.18"/>
    <circle cx="296" cy="296" r="14.5" fill="url(#blackStone)"/>
  </g>

  <!-- 胜利连线 -->
  <line x1="156" y1="156" x2="300" y2="300" stroke="#E53935" stroke-width="6.5" stroke-linecap="round" opacity="0.92"/>
</svg>
